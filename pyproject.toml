[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contradiction-atlas"
version = "0.1.0"
description = "Map conflicting claims without forcing premature resolution."
requires-python = ">=3.10"

[project.scripts]
contradiction-atlas = "contradiction_atlas:main"

[tool.setuptools]
py-modules = ["contradiction_atlas"]
